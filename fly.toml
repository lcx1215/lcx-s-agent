# OpenClaw Fly.io deployment configuration
# See https://fly.io/docs/reference/configuration/

app = "openclaw"
primary_region = "iad" # change to your closest region

[build]
dockerfile = "Dockerfile"

[env]
NODE_ENV = "production"
# Fly uses x86, but keep this for consistency
OPENCLAW_PREFER_PNPM = "1"
OPENCLAW_STATE_DIR = "/data"
NODE_OPTIONS = "--max-old-space-size=1536"
# Required: `serve` fails closed on a non-loopback bind without a token.
# Set it once with: fly secrets set LCX_SERVE_TOKEN=<value>
LCX_SERVE_BIND = "lan"

# Daemon-free shape: one in-process HTTP agent service (POST /agent, GET /healthz).
# Switch back to the gateway daemon only if you need channel adapters, the canvas
# host, or node pairing:
#   app = "node dist/index.js gateway --allow-unconfigured --port 3000 --bind lan"
[processes]
app = "node dist/index.js serve --bind lan --port 3000"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = false # Keep one machine warm; the service holds no connection state
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

[[http_service.checks]]
interval = "30s"
timeout = "5s"
grace_period = "20s"
method = "GET"
path = "/healthz"

[[vm]]
size = "shared-cpu-2x"
memory = "2048mb"

[mounts]
source = "openclaw_data"
destination = "/data"
# Describes the public Fly.io deployment shape for OpenClaw runtime services.
