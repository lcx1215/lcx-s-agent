name: Install Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: install-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-scope:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect docs-only changes
        id: check
        uses: ./.github/actions/detect-docs-changes

  install-smoke:
    needs: [docs-scope]
    if: needs.docs-scope.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CLI
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          check-latest: true

      - name: Setup pnpm + cache store
        uses: ./.github/actions/setup-pnpm-store-cache
        with:
          pnpm-version: "10.23.0"
          cache-key-suffix: "node22"
          use-sticky-disk: "false"

      - name: Install pnpm deps (minimal)
        run: pnpm install --ignore-scripts --frozen-lockfile

      - name: Set up Docker Builder
        uses: docker/setup-buildx-action@v3

      - name: Build changed sandbox images
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -n "$BASE_SHA" ]]; then
            git diff --name-only "$BASE_SHA" HEAD -- Dockerfile.sandbox Dockerfile.sandbox-browser > "$RUNNER_TEMP/lcx-sandbox-dockerfiles"
          else
            printf '%s\n' Dockerfile.sandbox Dockerfile.sandbox-browser > "$RUNNER_TEMP/lcx-sandbox-dockerfiles"
          fi
          while IFS= read -r dockerfile; do
            [[ -n "$dockerfile" ]] || continue
            docker build -t "lcx-sandbox-validation:${dockerfile#Dockerfile.}" -f "$dockerfile" .
          done < "$RUNNER_TEMP/lcx-sandbox-dockerfiles"

      - name: Run root Dockerfile CLI smoke
        run: |
          docker build -t openclaw-dockerfile-smoke:local -f Dockerfile .
          docker run --rm --entrypoint sh openclaw-dockerfile-smoke:local -lc 'which lcx && lcx --version'

      - name: Pack this LCX build for installer verification
        run: |
          mkdir -p "$RUNNER_TEMP/lcx-install-artifact"
          docker run --rm --user root --entrypoint sh -v "$RUNNER_TEMP/lcx-install-artifact:/out" openclaw-dockerfile-smoke:local -lc 'cd /app && npm pack --ignore-scripts --pack-destination /out'
          echo "LCX_INSTALL_TARBALL=$(find "$RUNNER_TEMP/lcx-install-artifact" -name 'lcx-agent-*.tgz' -print -quit)" >> "$GITHUB_ENV"

      - name: Run installer docker tests against this commit
        env:
          CLAWDBOT_NO_ONBOARD: "1"
          CLAWDBOT_INSTALL_SMOKE_SKIP_CLI: "1"
          CLAWDBOT_INSTALL_SMOKE_SKIP_NONROOT: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          CLAWDBOT_INSTALL_SMOKE_SKIP_PREVIOUS: "1"
        run: pnpm test:install:smoke
